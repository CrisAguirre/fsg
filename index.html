<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/logowhite.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Grupo Prisma Visión — Análisis facial y recomendación orientativa de monturas con probador virtual. Los resultados no sustituyen una medición óptica." />
    <meta name="theme-color" content="#0a0b0e" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>Grupo Prisma Visión — Glassescanner 3D</title>
    <style>
      /* Preloader estático: aparece antes de que React/Vite terminen de cargar. */
      .boot-preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 35%, rgba(255, 255, 255, 0.08), transparent 42%),
          #0a0b0e;
        color: #e5e7eb;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        transition: opacity 0.25s ease;
      }

      .boot-preloader--done {
        opacity: 0;
        pointer-events: none;
      }

      .boot-preloader__panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 28px 32px;
        text-align: center;
      }

      .boot-preloader__panel img {
        width: 96px;
        height: 96px;
        object-fit: contain;
        filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.45));
        animation: boot-float 2.8s ease-in-out infinite;
      }

      .boot-preloader__title {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .boot-preloader__detail {
        margin: 0;
        font-size: 0.82rem;
        color: #9ca3af;
      }

      .boot-preloader__dots {
        display: inline-flex;
        gap: 6px;
        margin-top: 4px;
      }

      .boot-preloader__dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #e5e7eb;
        animation: boot-dot 1.2s ease-in-out infinite;
      }

      .boot-preloader__dots span:nth-child(2) {
        animation-delay: 0.15s;
      }

      .boot-preloader__dots span:nth-child(3) {
        animation-delay: 0.3s;
      }

      @keyframes boot-float {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-6px);
        }
      }

      @keyframes boot-dot {
        0%,
        80%,
        100% {
          opacity: 0.25;
          transform: translateY(0);
        }

        40% {
          opacity: 1;
          transform: translateY(-3px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-preloader__panel img,
        .boot-preloader__dots span {
          animation: none;
        }
      }
    </style>
  </head>
  <body class="theme-dark">
    <div id="boot-preloader" class="boot-preloader" role="status" aria-live="polite">
      <div class="boot-preloader__panel">
        <img src="/icons/icon-192.png" alt="" width="96" height="96" />
        <p class="boot-preloader__title">Grupo Prisma Visión</p>
        <p class="boot-preloader__detail">Preparando Glassescanner 3D…</p>
        <span class="boot-preloader__dots" aria-hidden="true">
          <span></span><span></span><span></span>
        </span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
